name: run hardware job list

on:
  workflow_dispatch:
    inputs:
      joblist:
        description: "Job list path under data/joblists/ (e.g. data/joblists/example_smoke_test.json)"
        required: true
        type: string
      dry_run:
        description: "Build and transpile only; submit nothing"
        required: true
        type: boolean
        default: true
      submit_only:
        description: "Submit, write data/runs/<date>/<list name>_job_ids.json and exit without waiting (long queues; collect later with retrieve_jobs.yml)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hardware-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # GitHub kills a job at 360 minutes; run 35489912431 (20 Sep 2026) was cut off while its jobs were queued
    env:
      PYTHONUNBUFFERED: "1"    # every "submitted job <id>" line reaches the log as it is printed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (pinned versions)
        run: pip install -r requirements.lock && pip install -e . --no-deps
      - name: Check the job list path
        env:
          JOBLIST: ${{ inputs.joblist }}
        run: |
          case "$JOBLIST" in
            data/joblists/*.json) test -f "$JOBLIST" ;;
            *) echo "job list must be a committed file under data/joblists/"; exit 1 ;;
          esac
      - name: Dry run (fake backend, nothing submitted)
        if: ${{ inputs.dry_run }}
        env:
          JOBLIST: ${{ inputs.joblist }}
        run: python -m gradvar.hardware --joblist "$JOBLIST"
      - name: Submit the job list
        if: ${{ !inputs.dry_run }}
        env:
          JOBLIST: ${{ inputs.joblist }}
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
          QISKIT_IBM_INSTANCE: ${{ secrets.QISKIT_IBM_INSTANCE }}
          QISKIT_IBM_INSTANCE_OPEN: ${{ secrets.QISKIT_IBM_INSTANCE_OPEN }}
          SUBMIT_ONLY: ${{ inputs.submit_only }}
        run: |
          if [ "$SUBMIT_ONLY" = "true" ]; then set -- --submit-only; else set --; fi
          python -m gradvar.hardware --joblist "$JOBLIST" --yes-submit "$@"
      - name: "Upload the ISA circuits of Sampler jobs (Paper 2 Deviation 7 (vii); kept as an artefact, not committed)"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: circuits-qpy-${{ github.run_id }}
          path: data/artifacts/
          if-no-files-found: ignore
          retention-days: 90
      - name: Commit logs, job ids file and calibration snapshot (also after a failed or cancelled job, so the bundles of the succeeded jobs and the ids of the submitted ones are kept)
        if: ${{ always() && !inputs.dry_run }}
        env:
          JOBLIST: ${{ inputs.joblist }}
        run: |
          git config user.name "gradvar-hardware-bot"
          git config user.email "gradvar-hardware-bot@users.noreply.github.com"
          git add data/jobs/ data/calibrations/ data/runs/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "hardware run: $JOBLIST $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

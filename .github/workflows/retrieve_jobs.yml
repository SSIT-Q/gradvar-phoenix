name: retrieve hardware jobs

# Second step of a long-queue run: collects the results of jobs already submitted (by run_jobs.yml with submit_only, or by a
# run that was killed before it collected them) into the same bundles and CSV rows as the live path. Submits nothing.
#
# Deviation 65 (the retrieval in two phases; Paper 1 Estimator lists). The runner applies it only while the committed settings
# table data/settings/execution_calibration_settings.json says in_force; until then phase "results" with no commit is the
# retrieval as it always was.
#   phase metadata  bundles without results and the execution-time pool of every job (job.result() is not called); then the
#                   execution-time rows are drawn by scripts/redraw_execution.py in a step that holds no IBM credentials (it
#                   refuses to run when a result of the list is in the tree); everything is committed and the commit is printed;
#   phase results   the results. While Deviation 65 is in force: only with execution_rows_commit = the commit printed by phase
#                   metadata, and only when every bundle carries the pool of the first phase;
#   phase single    the retrieval as it was before the Deviation, said so in every job.json.
# The one re-run of Deviation 67 (iii) is decided and dispatched between the two phases by rerun_jobs.yml.
on:
  workflow_dispatch:
    inputs:
      ids_file:
        description: "Ids file under data/runs/ (e.g. data/runs/2026-09-20/smoke_02_job_ids.json): written by --submit-only, or by hand with job_id null and a discovery window"
        required: true
        type: string
      phase:
        description: "results (default; under Deviation 65 it needs execution_rows_commit), metadata (first phase, then the re-draw) or single (the retrieval as before Deviation 65, recorded as such)"
        required: true
        type: choice
        default: results
        options:
          - results
          - metadata
          - single
      execution_rows_commit:
        description: "phase results under Deviation 65: the 40-hex commit printed by phase metadata (it holds data/predictions/execution/<list>_*.json)"
        required: false
        type: string
        default: ""
      redraw_workers:
        description: "phase metadata: worker processes of scripts/redraw_execution.py"
        required: false
        type: string
        default: "4"

permissions:
  contents: write

concurrency:
  group: hardware-jobs
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # phase results looks the execution-rows commit up in this checkout and tests that it is an ancestor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (pinned versions)
        run: pip install -r requirements.lock && pip install -e . --no-deps
      - name: Check the ids file path
        env:
          IDS_FILE: ${{ inputs.ids_file }}
        run: |
          case "$IDS_FILE" in
            data/runs/*.json) test -f "$IDS_FILE" ;;
            *) echo "ids file must be a committed file under data/runs/"; exit 1 ;;
          esac
      - name: Retrieve the jobs (nothing is submitted; waits for jobs still queued)
        env:
          IDS_FILE: ${{ inputs.ids_file }}
          PHASE: ${{ inputs.phase }}
          ROWS_COMMIT: ${{ inputs.execution_rows_commit }}
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
          QISKIT_IBM_INSTANCE: ${{ secrets.QISKIT_IBM_INSTANCE }}
          QISKIT_IBM_INSTANCE_OPEN: ${{ secrets.QISKIT_IBM_INSTANCE_OPEN }}
        run: |
          case "$ROWS_COMMIT" in
            *[!0-9a-f]*) echo "execution_rows_commit must be a commit hash"; exit 1 ;;
          esac
          case "$PHASE" in
            metadata)
              if [ -n "$ROWS_COMMIT" ]; then echo "phase metadata takes no execution_rows_commit"; exit 1; fi
              python -m gradvar.hardware --retrieve "$IDS_FILE" --metadata-only ;;
            results)
              if [ -n "$ROWS_COMMIT" ]; then
                python -m gradvar.hardware --retrieve "$IDS_FILE" --execution-rows-commit "$ROWS_COMMIT"
              else
                python -m gradvar.hardware --retrieve "$IDS_FILE"     # the runner refuses this while Deviation 65 is in force
              fi ;;
            single)
              if [ -n "$ROWS_COMMIT" ]; then echo "phase single takes no execution_rows_commit"; exit 1; fi
              python -m gradvar.hardware --retrieve "$IDS_FILE" --single-phase ;;
            *) echo "unknown phase"; exit 1 ;;
          esac
      - name: "Phase metadata: draw the execution-time rows (no IBM credentials in this step; refuses when a result of the list is in the tree)"
        if: ${{ inputs.phase == 'metadata' }}
        env:
          IDS_FILE: ${{ inputs.ids_file }}
          WORKERS: ${{ inputs.redraw_workers }}
        run: |
          case "$WORKERS" in
            ""|*[!0-9]*) echo "redraw_workers must be a number"; exit 1 ;;
          esac
          python scripts/redraw_execution.py --ids "$IDS_FILE" --workers "$WORKERS"
      - name: "Upload the ISA circuits of Sampler jobs (kept as an artefact, not committed)"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: circuits-qpy-retrieve-${{ github.run_id }}
          path: data/artifacts/
          if-no-files-found: ignore
          retention-days: 90
      - name: Commit bundles, CSV, ids file and calibration snapshot (also after a failed job, so the bundles of the retrieved jobs are kept)
        if: ${{ always() }}
        env:
          IDS_FILE: ${{ inputs.ids_file }}
          PHASE: ${{ inputs.phase }}
        run: |
          git config user.name "gradvar-hardware-bot"
          git config user.email "gradvar-hardware-bot@users.noreply.github.com"
          git add data/jobs/ data/calibrations/ data/runs/
          for d in data/predictions/execution data/predictions/execution_exploratory; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "hardware retrieve ($PHASE): $IDS_FILE $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
            if [ "$PHASE" = "metadata" ]; then
              echo "execution_rows_commit for phase results (the commit on main that holds the pool and the rows): $(git rev-parse HEAD)"
            fi
          fi

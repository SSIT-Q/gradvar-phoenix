name: retrieve hardware jobs

# Second step of a long-queue run: collects the results of jobs already submitted (by run_jobs.yml with submit_only, or by a
# run that was killed before it collected them) into the same bundles and CSV rows as the live path. Submits nothing.
#
# Deviation 65 (the retrieval in two phases; Paper 1 Estimator lists). The runner applies it only while the committed settings
# table data/settings/execution_calibration_settings.json says in_force; until then phase "results" with no commit is the
# retrieval as it always was.
#   phase metadata  bundles without results and the execution-time pool of every job (job.result() is not called); the bundles
#                   are committed and the phase's status is printed: complete (every pool is closed), pending (IBM has not yet
#                   published the change of values that closes a pool: run the phase again later) or stopped. No row is drawn
#                   here: the execution-time rows are drawn by redraw_execution.yml, on its own, once the phase is complete;
#   phase results   the results. While Deviation 65 is in force: only with execution_rows_commit = the commit printed by
#                   redraw_execution.yml, and only when the pool of every job of the list is closed;
#   phase single    the retrieval as it was before the Deviation, said so in every job.json. While Deviation 65 is in force
#                   the runner refuses it unless every job of the ids file is older than the adoption.
# The one re-run of Deviation 67 (iii) is decided and dispatched between the two phases by rerun_jobs.yml.
# The steps that hold the IBM secrets or commit run on refs/heads/main only.
on:
  workflow_dispatch:
    inputs:
      ids_file:
        description: "Ids file under data/runs/ (e.g. data/runs/2026-09-20/smoke_02_job_ids.json): written by --submit-only, or by hand with job_id null and a discovery window"
        required: true
        type: string
      phase:
        description: "results (default; under Deviation 65 it needs execution_rows_commit), metadata (first phase; the rows are drawn afterwards by the workflow 'draw the execution-time rows') or single (the retrieval as before Deviation 65, recorded as such)"
        required: true
        type: choice
        default: results
        options:
          - results
          - metadata
          - single
      execution_rows_commit:
        description: "phase results under Deviation 65: the 40-hex commit printed by the workflow 'draw the execution-time rows' (it holds data/predictions/execution/<list>_*.json)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: hardware-jobs
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Refuse any ref but main (the retrieval holds the IBM secrets and commits to main)
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "this workflow runs on refs/heads/main only; it was started on $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # phase results looks the execution-rows commit up in this checkout and tests that it is an ancestor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (pinned versions)
        run: pip install -r requirements.lock && pip install -e . --no-deps
      - name: Check the ids file path
        env:
          IDS_FILE: ${{ inputs.ids_file }}
        run: |
          case "$IDS_FILE" in
            data/runs/*.json) test -f "$IDS_FILE" ;;
            *) echo "ids file must be a committed file under data/runs/"; exit 1 ;;
          esac
      - name: Retrieve the jobs (nothing is submitted; waits for jobs still queued)
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          IDS_FILE: ${{ inputs.ids_file }}
          PHASE: ${{ inputs.phase }}
          ROWS_COMMIT: ${{ inputs.execution_rows_commit }}
          STATUS_FILE: ${{ runner.temp }}/first_phase_status.json
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
          QISKIT_IBM_INSTANCE: ${{ secrets.QISKIT_IBM_INSTANCE }}
          QISKIT_IBM_INSTANCE_OPEN: ${{ secrets.QISKIT_IBM_INSTANCE_OPEN }}
        run: |
          case "$ROWS_COMMIT" in
            *[!0-9a-f]*) echo "execution_rows_commit must be a commit hash"; exit 1 ;;
          esac
          case "$PHASE" in
            metadata)
              if [ -n "$ROWS_COMMIT" ]; then echo "phase metadata takes no execution_rows_commit"; exit 1; fi
              python -m gradvar.hardware --retrieve "$IDS_FILE" --metadata-only --phase-status-file "$STATUS_FILE" ;;
            results)
              if [ -n "$ROWS_COMMIT" ]; then
                python -m gradvar.hardware --retrieve "$IDS_FILE" --execution-rows-commit "$ROWS_COMMIT"
              else
                python -m gradvar.hardware --retrieve "$IDS_FILE"     # the runner refuses this while Deviation 65 is in force
              fi ;;
            single)
              if [ -n "$ROWS_COMMIT" ]; then echo "phase single takes no execution_rows_commit"; exit 1; fi
              python -m gradvar.hardware --retrieve "$IDS_FILE" --single-phase ;;
            *) echo "unknown phase"; exit 1 ;;
          esac
      - name: "Upload the ISA circuits of Sampler jobs (kept as an artefact, not committed)"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: circuits-qpy-retrieve-${{ github.run_id }}
          path: data/artifacts/
          if-no-files-found: ignore
          retention-days: 90
      - name: Commit bundles, CSV, ids file and calibration snapshot (also after a failed job, so the bundles of the retrieved jobs are kept)
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          IDS_FILE: ${{ inputs.ids_file }}
          PHASE: ${{ inputs.phase }}
          STATUS_FILE: ${{ runner.temp }}/first_phase_status.json
        run: |
          git config user.name "gradvar-hardware-bot"
          git config user.email "gradvar-hardware-bot@users.noreply.github.com"
          git add data/jobs/ data/calibrations/ data/runs/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "hardware retrieve ($PHASE): $IDS_FILE $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
          if [ "$PHASE" = "metadata" ]; then
            # the status the first phase ended with; no row is drawn in this workflow and no commit for phase results is printed here
            status="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$STATUS_FILE" 2>/dev/null || echo "not reported")"
            case "$status" in
              complete) echo "first phase: complete, every pool is closed. Next: the workflow 'draw the execution-time rows (Deviation 65)' with this ids file and first_phase_commit $(git rev-parse HEAD)" ;;
              pending) echo "first phase: pending. IBM has not yet published the change of values that closes every pool. Run phase metadata again later; until it is complete no row is drawn and no result can be retrieved" ;;
              *) echo "first phase: $status. See the retrieval step; no row is drawn and no result can be retrieved" ;;
            esac
          fi

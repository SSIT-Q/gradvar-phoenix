[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradvar-phoenix"
version = "0.1.0"
description = "Barren-plateau gradient-variance study on the ibm_phoenix square lattice"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "qiskit>=1.2",
  "qiskit-ibm-runtime",
  "numpy",
  "pandas",
  "matplotlib",
  "pytest",
]

[project.optional-dependencies]
aer = ["qiskit-aer"]

[tool.setuptools]
packages = ["gradvar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
